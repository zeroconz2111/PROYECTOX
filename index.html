<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventario de Productos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.85;
        }

        .contenedor {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .estadistica {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .estadistica h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .estadistica strong {
            font-size: 28px;
            color: #111827;
        }

        .controles {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .estado {
            background: white;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .cargando {
            font-size: 18px;
            color: #555;
        }

        .error {
            color: #b91c1c;
        }

        .tabla-contenedor {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .producto-imagen {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .sin-imagen {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #777;
        }

        .stock {
            font-weight: bold;
        }

        .stock-ok {
            color: #15803d;
        }

        .stock-bajo {
            color: #d97706;
        }

        .stock-agotado {
            color: #dc2626;
        }

        .precio {
            font-weight: bold;
            color: #111827;
        }

        .btn-detalles {
            border: none;
            background: #2563eb;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .btn-detalles:hover {
            background: #1d4ed8;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tarjeta-imagen {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eee;
        }

        .tarjeta-contenido {
            padding: 18px;
        }

        .tarjeta h3 {
            margin-bottom: 8px;
        }

        .tarjeta p {
            margin-bottom: 7px;
            color: #555;
        }

        .tarjeta .precio {
            font-size: 20px;
            margin: 12px 0;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-contenido {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            border-radius: 14px;
            padding: 25px;
            position: relative;
        }

        .cerrar {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #555;
        }

        .detalle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detalle {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
        }

        .detalle strong {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .controles {
                grid-template-columns: 1fr 1fr;
            }

            .estadisticas {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .controles {
                grid-template-columns: 1fr;
            }

            .contenedor {
                padding: 0 10px;
            }

            .detalle-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Inventario de Productos</h1>
    <p>Catálogo actualizado desde Google Sheets</p>
</header>

<div class="contenedor">

    <div class="estadisticas">
        <div class="estadistica">
            <h3>Productos</h3>
            <strong id="totalProductos">0</strong>
        </div>

        <div class="estadistica">
            <h3>Unidades disponibles</h3>
            <strong id="totalUnidades">0</strong>
        </div>

        <div class="estadistica">
            <h3>Valor del inventario</h3>
            <strong id="valorInventario">$0.00</strong>
        </div>
    </div>

    <div class="controles">

        <input
            type="text"
            id="busqueda"
            placeholder="Buscar producto, marca, modelo o SKU..."
        >

        <select id="categoria">
            <option value="">Todas las categorías</option>
        </select>

        <select id="orden">
            <option value="nombre-asc">Nombre A-Z</option>
            <option value="nombre-desc">Nombre Z-A</option>
            <option value="precio-asc">Precio menor</option>
            <option value="precio-desc">Precio mayor</option>
            <option value="stock-desc">Mayor stock</option>
            <option value="stock-asc">Menor stock</option>
        </select>

        <select id="vista">
            <option value="tabla">Vista de tabla</option>
            <option value="tarjetas">Vista de tarjetas</option>
        </select>

    </div>

    <div id="estado" class="estado">
        <div class="cargando">
            Cargando inventario...
        </div>
    </div>

    <div id="contenido"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

    <div class="modal-contenido">

        <span class="cerrar" onclick="cerrarModal()">
            &times;
        </span>

        <div id="detalleProducto"></div>

    </div>

</div>

<script>

const API_URL =
    'https://script.google.com/macros/s/AKfycbztp9XZKk-UGBi6if6AFDb155_68gJ1QojW0WI4GS6kAO5DTkSoSdBNEB_EOlcbqHRB/exec';


let productosList = [];
let productosFiltrados = [];


/* =========================================================
   CARGAR INVENTARIO CON JSONP
   ========================================================= */

function cargarInventario() {

    mostrarCarga();

    const callbackName =
        'inventarioCallback_' + Date.now();

    window[callbackName] = function(data) {

        console.log('Respuesta de la API:', data);

        if (!data || data.success !== true) {

            mostrarError(
                data && data.error
                    ? data.error
                    : 'La API devolvió un error'
            );

            limpiarJSONP();
            return;
        }

        productosList =
            Array.isArray(data.productos)
                ? data.productos
                : [];

        productosFiltrados =
            [...productosList];

        console.log(
            'Productos cargados:',
            productosList.length
        );

        llenarCategorias();

        ordenar();

        actualizarEstadisticas();

        if (productosList.length === 0) {

            mostrarSinResultados();

            limpiarJSONP();
            return;
        }

        renderizar();

        ocultarCarga();

        limpiarJSONP();
    };


    const script =
        document.createElement('script');

    script.src =
        API_URL +
        '?accion=productos&callback=' +
        callbackName;

    script.onerror = function() {

        console.error(
            'Error cargando JSONP desde Google Apps Script'
        );

        mostrarError(
            'No se pudo conectar con la API'
        );

        limpiarJSONP();
    };


    document.body.appendChild(script);


    function limpiarJSONP() {

        if (script.parentNode) {
            script.parentNode.removeChild(script);
        }

        delete window[callbackName];
    }
}

    const script =
        document.createElement('script');


    script.id =
        'jsonp-inventario';


    script.src =
        API_URL +
        '?accion=productos&callback=' +
        encodeURIComponent(callbackName);


    script.onerror = function() {

        console.error(
            'No se pudo conectar con la API'
        );


        mostrarError(
            'No se pudo conectar con Google Apps Script'
        );


        limpiarJSONP();

    };


    document.body.appendChild(script);


    function limpiarJSONP() {

        const elemento =
            document.getElementById(
                'jsonp-inventario'
            );


        if (elemento) {

            elemento.remove();

        }


        delete window[callbackName];

    }

}


/* =========================================================
   ESTADOS
   ========================================================= */

function mostrarCarga() {

    document.getElementById('estado').style.display =
        'block';

    document.getElementById('estado').innerHTML =
        '<div class="cargando">Cargando inventario...</div>';

    document.getElementById('contenido').innerHTML =
        '';

}


function ocultarCarga() {

    document.getElementById('estado').style.display =
        'none';

}


function mostrarError(mensaje) {

    document.getElementById('estado').style.display =
        'block';

    document.getElementById('estado').innerHTML =
        '<div class="error">' +
        '<h3>No se pudo cargar el inventario</h3>' +
        '<p>' + mensaje + '</p>' +
        '</div>';

}


function mostrarSinResultados() {

    document.getElementById('estado').style.display =
        'block';

    document.getElementById('estado').innerHTML =
        '<div>' +
        '<h3>No hay productos disponibles</h3>' +
        '<p>No se encontraron productos en el inventario.</p>' +
        '</div>';

}


/* =========================================================
   CATEGORÍAS
   ========================================================= */

function llenarCategorias() {

    const select =
        document.getElementById('categoria');


    const categorias =
        [...new Set(
            productosList
                .map(p => p.Categoria)
                .filter(Boolean)
        )].sort();


    select.innerHTML =
        '<option value="">Todas las categorías</option>';


    categorias.forEach(categoria => {

        const option =
            document.createElement('option');

        option.value =
            categoria;

        option.textContent =
            categoria;

        select.appendChild(option);

    });

}


/* =========================================================
   FILTRAR
   ========================================================= */

function filtrar() {

    const texto =
        document
            .getElementById('busqueda')
            .value
            .toLowerCase()
            .trim();


    const categoria =
        document
            .getElementById('categoria')
            .value;


    productosFiltrados =
        productosList.filter(producto => {

            const coincideTexto =
                !texto ||

                String(producto.Nombre_Producto || '')
                    .toLowerCase()
                    .includes(texto) ||

                String(producto.Marca || '')
                    .toLowerCase()
                    .includes(texto) ||

                String(producto.Modelo || '')
                    .toLowerCase()
                    .includes(texto) ||

                String(producto.SKU || '')
                    .toLowerCase()
                    .includes(texto);


            const coincideCategoria =
                !categoria ||
                producto.Categoria === categoria;


            return coincideTexto &&
                   coincideCategoria;

        });


    ordenar();

    actualizarEstadisticas();


    if (productosFiltrados.length === 0) {

        mostrarSinResultados();

        return;

    }


    ocultarCarga();

    renderizar();

}


/* =========================================================
   ORDENAR
   ========================================================= */

function ordenar() {

    const orden =
        document
            .getElementById('orden')
            .value;


    productosFiltrados.sort((a, b) => {

        switch (orden) {

            case 'nombre-desc':

                return String(b.Nombre_Producto || '')
                    .localeCompare(
                        String(a.Nombre_Producto || '')
                    );


            case 'precio-asc':

                return Number(a.Precio_MXN || 0) -
                       Number(b.Precio_MXN || 0);


            case 'precio-desc':

                return Number(b.Precio_MXN || 0) -
                       Number(a.Precio_MXN || 0);


            case 'stock-desc':

                return Number(b.Stock || 0) -
                       Number(a.Stock || 0);


            case 'stock-asc':

                return Number(a.Stock || 0) -
                       Number(b.Stock || 0);


            case 'nombre-asc':
            default:

                return String(a.Nombre_Producto || '')
                    .localeCompare(
                        String(b.Nombre_Producto || '')
                    );

        }

    });

}


/* =========================================================
   RENDERIZAR
   ========================================================= */

function renderizar() {

    const vista =
        document
            .getElementById('vista')
            .value;


    if (vista === 'tarjetas') {

        renderizarTarjetas();

    } else {

        renderizarTabla();

    }

}


/* =========================================================
   TABLA
   ========================================================= */

function renderizarTabla() {

    const contenido =
        document.getElementById('contenido');


    let html = `
        <div class="tabla-contenedor">
        <table>

            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>SKU</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody>
    `;


    productosFiltrados.forEach(producto => {

        const stock =
            Number(producto.Stock || 0);


        let claseStock =
            'stock-ok';


        if (stock <= 0) {

            claseStock =
                'stock-agotado';

        } else if (
            producto.Stock_Minimo &&
            stock <= Number(producto.Stock_Minimo)
        ) {

            claseStock =
                'stock-bajo';

        }


        const imagen =
            producto.URL_Imagen;


        html += `

            <tr>

                <td>

                    ${
                        imagen

                        ?

                        `<img
                            src="${imagen}"
                            class="producto-imagen"
                            alt="Producto"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                        >
                        <div
                            class="sin-imagen"
                            style="display:none"
                        >
                            Sin imagen
                        </div>`

                        :

                        `<div class="sin-imagen">
                            Sin imagen
                        </div>`
                    }

                </td>


                <td>
                    <strong>
                        ${producto.Nombre_Producto || 'Sin nombre'}
                    </strong>

                    <br>

                    <small>
                        ${producto.Descripcion || ''}
                    </small>
                </td>


                <td>
                    ${producto.Marca || '-'}
                </td>


                <td>
                    ${producto.Modelo || '-'}
                </td>


                <td>
                    ${producto.SKU || '-'}
                </td>


                <td>
                    ${producto.Categoria || '-'}
                </td>


                <td class="precio">
                    $${Number(
                        producto.Precio_MXN || 0
                    ).toLocaleString(
                        'es-MX',
                        {
                            minimumFractionDigits: 2
                        }
                    )}
                </td>


                <td class="stock ${claseStock}">
                    ${stock}
                </td>


                <td>

                    <button
                        class="btn-detalles"
                        onclick="verDetalles('${producto.SKU || producto.ID}')"
                    >
                        Ver detalles
                    </button>

                </td>

            </tr>

        `;

    });


    html += `
            </tbody>

        </table>

        </div>
    `;


    contenido.innerHTML =
        html;

}


/* =========================================================
   TARJETAS
   ========================================================= */

function renderizarTarjetas() {

    const contenido =
        document.getElementById('contenido');


    let html =
        '<div class="tarjetas">';


    productosFiltrados.forEach(producto => {

        const imagen =
            producto.URL_Imagen;


        const stock =
            Number(producto.Stock || 0);


        html += `

            <div class="tarjeta">

                ${
                    imagen

                    ?

                    `<img
                        src="${imagen}"
                        class="tarjeta-imagen"
                        alt="Producto"
                    >`

                    :

                    `<div
                        class="tarjeta-imagen"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#777;
                        "
                    >
                        Sin imagen
                    </div>`
                }


                <div class="tarjeta-contenido">

                    <h3>
                        ${producto.Nombre_Producto || 'Sin nombre'}
                    </h3>


                    <p>
                        <strong>Marca:</strong>
                        ${producto.Marca || '-'}
                    </p>


                    <p>
                        <strong>Modelo:</strong>
                        ${producto.Modelo || '-'}
                    </p>


                    <p>
                        <strong>SKU:</strong>
                        ${producto.SKU || '-'}
                    </p>


                    <p>
                        <strong>Categoría:</strong>
                        ${producto.Categoria || '-'}
                    </p>


                    <div class="precio">

                        $${Number(
                            producto.Precio_MXN || 0
                        ).toLocaleString(
                            'es-MX',
                            {
                                minimumFractionDigits: 2
                            }
                        )}

                    </div>


                    <p>
                        <strong>Stock:</strong>
                        ${stock}
                    </p>


                    <button
                        class="btn-detalles"
                        onclick="verDetalles('${producto.SKU || producto.ID}')"
                    >
                        Ver detalles
                    </button>

                </div>

            </div>

        `;

    });


    html +=
        '</div>';


    contenido.innerHTML =
        html;

}


/* =========================================================
   DETALLES
   ========================================================= */

function verDetalles(identificador) {

    const producto =
        productosList.find(p =>
            String(p.SKU) === String(identificador) ||
            String(p.ID) === String(identificador)
        );


    if (!producto) {

        return;

    }


    const modal =
        document.getElementById('modal');


    const detalle =
        document.getElementById(
            'detalleProducto'
        );


    const imagen =
        producto.URL_Imagen;


    detalle.innerHTML = `

        <h2>
            ${producto.Nombre_Producto || 'Producto'}
        </h2>


        ${
            imagen

            ?

            `<img
                src="${imagen}"
                style="
                    width:100%;
                    max-height:350px;
                    object-fit:contain;
                    margin:20px 0;
                    border-radius:10px;
                "
                alt="Producto"
            >`

            :

            ''
        }


        <p>
            ${producto.Descripcion || 'Sin descripción'}
        </p>


        <div class="detalle-grid">

            <div class="detalle">
                <strong>ID</strong>
                ${producto.ID || '-'}
            </div>


            <div class="detalle">
                <strong>SKU</strong>
                ${producto.SKU || '-'}
            </div>


            <div class="detalle">
                <strong>Modelo</strong>
                ${producto.Modelo || '-'}
            </div>


            <div class="detalle">
                <strong>Marca</strong>
                ${producto.Marca || '-'}
            </div>


            <div class="detalle">
                <strong>Categoría</strong>
                ${producto.Categoria || '-'}
            </div>


            <div class="detalle">
                <strong>Precio</strong>
                $${Number(
                    producto.Precio_MXN || 0
                ).toLocaleString(
                    'es-MX',
                    {
                        minimumFractionDigits: 2
                    }
                )}
            </div>


            <div class="detalle">
                <strong>Descuento</strong>
                ${producto.Descuento_Pct || 0}%
            </div>


            <div class="detalle">
                <strong>IVA</strong>
                ${producto.IVA_Pct || 0}%
            </div>


            <div class="detalle">
                <strong>Stock</strong>
                ${producto.Stock || 0}
            </div>


            <div class="detalle">
                <strong>Estado del stock</strong>
                ${producto.Estado_Stock || '-'}
            </div>


            <div class="detalle">
                <strong>Peso</strong>
                ${producto.Peso_Kg || '-'} kg
            </div>


            <div class="detalle">
                <strong>Garantía</strong>
                ${producto.Garantia_Meses || 0} meses
            </div>


            <div class="detalle">
                <strong>Calificación</strong>
                ${producto.Calificacion || '-'}
            </div>

        </div>

    `;


    modal.style.display =
        'block';

}


/* =========================================================
   CERRAR MODAL
   ========================================================= */

function cerrarModal() {

    document.getElementById('modal').style.display =
        'none';

}


window.addEventListener(
    'click',
    function(event) {

        const modal =
            document.getElementById('modal');


        if (event.target === modal) {

            cerrarModal();

        }

    }
);


/* =========================================================
   ESTADÍSTICAS
   ========================================================= */

function actualizarEstadisticas() {

    const totalProductos =
        productosFiltrados.length;


    const totalUnidades =
        productosFiltrados.reduce(
            (total, producto) =>
                total +
                Number(producto.Stock || 0),
            0
        );


    const valorInventario =
        productosFiltrados.reduce(
            (total, producto) =>
                total +
                (
                    Number(producto.Precio_MXN || 0) *
                    Number(producto.Stock || 0)
                ),
            0
        );


    document.getElementById(
        'totalProductos'
    ).textContent =
        totalProductos;


    document.getElementById(
        'totalUnidades'
    ).textContent =
        totalUnidades.toLocaleString(
            'es-MX'
        );


    document.getElementById(
        'valorInventario'
    ).textContent =
        '$' +
        valorInventario.toLocaleString(
            'es-MX',
            {
                minimumFractionDigits: 2
            }
        );

}


/* =========================================================
   EVENTOS
   ========================================================= */

document
    .getElementById('busqueda')
    .addEventListener(
        'input',
        filtrar
    );


document
    .getElementById('categoria')
    .addEventListener(
        'change',
        filtrar
    );


document
    .getElementById('orden')
    .addEventListener(
