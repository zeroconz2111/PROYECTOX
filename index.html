<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Sistema de Gestión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>📦 Inventario Disponible</h1>
                <p>Vista detallada de productos en stock</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Sección de Filtros -->
        <section class="filters-section">
            <div class="filters-wrapper">
                <div class="filter-item">
                    <label for="searchInput">🔍 Buscar:</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Código, nombre o descripción..."
                        class="input-search"
                    >
                </div>

                <div class="filter-item">
                    <label for="categoryFilter">📂 Categoría:</label>
                    <select id="categoryFilter" class="input-select">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="sortBy">↕️ Ordenar por:</label>
                    <select id="sortBy" class="input-select">
                        <option value="nombre">Nombre (A-Z)</option>
                        <option value="precio-asc">Precio (↓)</option>
                        <option value="precio-desc">Precio (↑)</option>
                        <option value="stock-desc">Stock (Mayor)</option>
                        <option value="stock-asc">Stock (Menor)</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="viewType">👁️ Vista:</label>
                    <select id="viewType" class="input-select">
                        <option value="tabla">Tabla Detallada</option>
                        <option value="tarjetas">Tarjetas</option>
                    </select>
                </div>

                <button id="resetFilters" class="btn-reset">🔄 Limpiar</button>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Productos</span>
                    <span class="stat-value" id="totalProductos">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Productos Mostrados</span>
                    <span class="stat-value" id="productosVisibles">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Valor Total Stock</span>
                    <span class="stat-value" id="valorTotal">$0</span>
                </div>
            </div>
        </section>

        <!-- Estado de Carga -->
        <div id="loadingState" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Cargando inventario...</p>
        </div>

        <!-- Tabla Vista Detallada -->
        <section id="tablaView" class="tabla-container">
            <div class="tabla-wrapper">
                <table class="tabla-inventario" id="tablaProductos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Precio Unit.</th>
                            <th>Stock</th>
                            <th>Valor Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyProductos">
                        <!-- Los productos se cargarán aquí -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Vista Tarjetas -->
        <section id="tarjetasView" class="tarjetas-container" style="display: none;">
            <div id="tarjetasProductos" class="tarjetas-grid">
                <!-- Las tarjetas se cargarán aquí -->
            </div>
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-content">
                <p class="empty-icon">📭</p>
                <p class="empty-text">No se encontraron productos con los filtros seleccionados</p>
            </div>
        </div>
    </main>

    <!-- Modal Detalles Producto -->
    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody" class="modal-body">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
